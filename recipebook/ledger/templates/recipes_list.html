{% extends 'base.html' %}

{% block page_heading %}

{% block content %}

{% for recipe in recipe_list %}

{% endfor %}
</ul>

<a href="{% url 'ledger:recipe_add' %}">Add a New Recipe</a>

{% endblock %}
